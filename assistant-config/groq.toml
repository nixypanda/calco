# Local AI food-assistant configuration for Groq's free plan.
# Replace the contents of groq-api-key with your Groq API key.

[ai]
enabled = true
endpoint = "https://api.groq.com/openai/v1/chat/completions"
model = "qwen/qwen3.6-27b"
supports_images = true

[ai.authentication]
kind = "bearer"
api_key_file = "assistant-config/groq-api-key"
