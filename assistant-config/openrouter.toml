# Local AI food-assistant configuration for OpenRouter's free-model router.
# Replace the contents of openrouter-api-key with your OpenRouter API key.

[assistant]
enabled = true
endpoint = "https://openrouter.ai/api/v1/chat/completions"
model = "openrouter/free"
supports_images = true

[assistant.authentication]
kind = "bearer"
api_key_file = "assistant-config/openrouter-api-key"
