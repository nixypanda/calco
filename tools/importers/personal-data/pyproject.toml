[project]
name = "calco-personal-data-import"
version = "0.1.0"
description = "Personal data import tools for CalCo (MyFitnessPal, etc.)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "rapidfuzz>=3.0",
]

[tool.uv]
package = true

[dependency-groups]
dev = ["ruff>=0.15.12", "ty>=0.0.35"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915"]


select = [
    "ANN",
    "B",
    "C4",
    "E",
    "EM",
    "F",
    "G",
    "I",
    "ICN",
    "INP",
    "LOG",
    "PIE",
    "PL",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "T10",
    "TID",
    "UP",
    "W",
    "YTT",
    "BLE",
    "N",
    "PERF",
    "SLF",
    "TCH",
    "ARG",
    "ERA",
    "FURB",
]

[tool.ty.environment]
python-version = "3.12"
root = ["."]

[tool.ty.src]
include = ["**/*.py"]
