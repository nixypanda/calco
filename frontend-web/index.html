<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="CalCo" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="darkreader-lock" />
    <script>
      // Apply the saved/system scheme before CSS paints, so dark mode does not
      // flash the light document background while Elm starts.
      (function () {
        var preference;
        try {
          preference = localStorage.getItem("themeMode");
        } catch (_) {}
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var mode =
          preference === "light"
            ? "light"
            : preference === "dark" || prefersDark
              ? "dark"
              : "light";
        var color = mode === "dark" ? "#12141a" : "#f4f6f8";
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
        document.documentElement.style.backgroundColor = color;
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute("content", color);
        }
      })();
    </script>
    <title>CalCo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
