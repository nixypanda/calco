[package]
name = "calco-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "uuid", "chrono", "rust_decimal", "macros", "migrate"] }
sea-query = { version = "1.0", default-features = false, features = ["derive", "backend-postgres", "with-uuid", "with-chrono", "with-rust_decimal", "postgres-array"] }
sea-query-sqlx = { version = "0.9", features = ["sqlx-postgres", "runtime-tokio", "with-uuid", "with-chrono", "with-rust_decimal", "postgres-array"] }
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
toml_edit = { version = "0.25", features = ["serde"] }
url = "2"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
