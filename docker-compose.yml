services:
  postgres:
    image: postgres:16-alpine
    container_name: calco-db
    environment:
      POSTGRES_DB: calco
      POSTGRES_USER: calco
      POSTGRES_PASSWORD: calco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calco"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
